services:
  caddy:
    image: caddy:2-alpine
    platform: linux/amd64
    container_name: tutochka_caddy
    restart: always
    init: true
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.50
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tutochka_net

  backend:
    image: ghcr.io/yayauheny/tutochka-backend:${BACKEND_TAG:-prod}
    pull_policy: always
    platform: linux/amd64
    container_name: tutochka_backend
    restart: always
    init: true
    mem_limit: 2048m
    mem_reservation: 1024m
    cpus: 1.50
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-6}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-0}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-600000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1800000}
      ENCRYPTION_KEYSET_JSON: ${ENCRYPTION_KEYSET_JSON}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_WEBHOOK_PATH: ${BOT_WEBHOOK_PATH:-/telegram/webhook}
      BOT_WEBHOOK_PUBLIC_URL: ${BOT_WEBHOOK_PUBLIC_URL}
      BOT_WEBHOOK_SECRET_TOKEN: ${BOT_WEBHOOK_SECRET_TOKEN}
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS:-}
      BACKEND_LOG_DIR: /app/logs
      JAVA_TOOL_OPTIONS: >-
        -Xms256m
        -Xmx1536m
        -XX:MaxMetaspaceSize=256m
        -XX:MaxDirectMemorySize=128m
        -Xss512k
        -XX:+UseContainerSupport
        -XX:+ExitOnOutOfMemoryError
    networks:
      - tutochka_net
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.15.1
    platform: linux/amd64
    container_name: tutochka_alloy
    restart: always
    init: true
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.50
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      GRAFANA_CLOUD_URL: ${GRAFANA_CLOUD_URL}
      GRAFANA_CLOUD_USERNAME: ${GRAFANA_CLOUD_USERNAME}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
      - backend_logs:/var/log/tutochka/backend:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tutochka_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  alloy_data:
  backend_logs:

networks:
  tutochka_net:
    driver: bridge
