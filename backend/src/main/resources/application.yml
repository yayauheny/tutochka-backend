server:
  port: ${BACKEND_PORT:${APP_PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: tutochka-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:public}&sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  api:
    defaults:
      page: 0
      page-size: 20
      max-nearest-restrooms-size: 50
      max-distance-meters: 5000
    limits:
      max-name-length: 100
      min-name-length: 0
      min-name-length-required: 1
      max-region-length: 100
      max-country-code-length: 2
      max-description-length: 1000
      max-address-length: 255
      max-json-string-length: 5000
  restroom-cache:
    enabled: true
    nearest:
      enabled: true
      key-prefix: restrooms:nearest
      startup-load-mode: full
      refresh-mode: incremental
      fallback-to-database: true
      max-search-radius-meters: 20000
      max-result-limit: 100
      candidate-limit-multiplier: 10
      max-candidate-limit: 500
      load-page-size: 1000
      redis-pipeline-batch-size: 500
      max-incremental-change-ids: 1000
      old-version-ttl: 30m
      rebuild-lock-ttl: 2m
      min-ready-items: 1
    popular-details:
      enabled: true
      key-prefix: restrooms:popular
      algorithm: lfu
      max-items: 100
      detail-ttl: 24h
      score-ttl: 30d
      refresh-interval: 5m
      lfu-decay-interval: 1d
      lfu-decay-factor: 0.9
      load-page-size: 100
      redis-pipeline-batch-size: 100

encryption:
  keyset:
    json: ${ENCRYPTION_KEYSET_JSON:}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:}
    webhook-path: ${BOT_WEBHOOK_PATH:/telegram/webhook}
    webhook-public-url: ${BOT_WEBHOOK_PUBLIC_URL:}
    webhook-secret-token: ${BOT_WEBHOOK_SECRET_TOKEN:}
    admin-ids: ${BOT_ADMIN_IDS:}
    search:
      default-radius-meters: ${BOT_SEARCH_DEFAULT_RADIUS_METERS:15000}
      nearest-limit: ${BOT_SEARCH_NEAREST_LIMIT:5}
