[versions]
kotlin = "2.2.20"
springBoot = "3.5.6"
springDependencyManagement = "1.1.7"
querydsl = "5.1.0"
postgresql = "42.7.7"
testcontainers = "1.20.1"
liquibase = "2.2.2"
mockk = "1.13.8"
kotlinxCoroutinesTest = "1.7.3"
junitJupiter = "5.10.1"
junitPlatform = "1.12.2"
swagger = "2.2.15"
ktlint = "12.1.1"
jtsCore = "1.20.0"
caffeine = "3.1.8"
telegrambots = "9.2.0"
wiremock = "2.35.0"
resilience4j = "2.2.0"
micrometer = "1.14.5"
assertj = "3.27.3"
jackson = "2.19.2"
tink = "1.21.0"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
springBootPlugin = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagementPlugin = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlinSpringPlugin = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinJpaPlugin = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlinKaptPlugin = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
serializationPlugin = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
liquibasePlugin = { id = "org.liquibase.gradle", version.ref = "liquibase" }
ktlintPlugin = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
# Spring Boot
springBootStarterWeb = { module = "org.springframework.boot:spring-boot-starter-web" }
springBootStarterDataJpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
springBootStarterDataRedis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBootStarterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
postgis = { module = "net.postgis:postgis-jdbc", version = "2025.1.1" }
liquibaseCore = { module = "org.liquibase:liquibase-core", version = "4.24.0" }
picocli = { module = "info.picocli:picocli", version = "4.6.3" }
jtsCore = { module = "org.locationtech.jts:jts-core", version.ref = "jtsCore" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
hibernateSpatial = { module = "org.hibernate.orm:hibernate-spatial" }

# Swagger/OpenAPI
swaggerCore = { module = "io.swagger.core.v3:swagger-core", version.ref = "swagger" }
swaggerAnnotations = { module = "io.swagger.core.v3:swagger-annotations", version.ref = "swagger" }
swaggerModels = { module = "io.swagger.core.v3:swagger-models", version.ref = "swagger" }
swaggerJaxrs2 = { module = "io.swagger.core.v3:swagger-jaxrs2", version.ref = "swagger" }
jacksonAnnotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jacksonModuleKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Metrics
micrometerPrometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Bot / misc
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
telegrambotsClient = { module = "org.telegram:telegrambots-client", version.ref = "telegrambots" }
telegrambotsWebhook = { module = "org.telegram:telegrambots-webhook", version.ref = "telegrambots" }
wiremockJre8 = { module = "com.github.tomakehurst:wiremock-jre8", version.ref = "wiremock" }
resilience4jRetry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }

# Testing
testcontainersPostgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainersCore = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainersJunit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[bundles]
springBootBundle = [
    "springBootStarterWeb",
    "springBootStarterDataJpa",
    "springBootStarterValidation",
    "springBootStarterActuator",
    "jacksonModuleKotlin",
    "hibernateSpatial"
]
liquibaseBundle = ["liquibaseCore", "postgresql", "picocli"]
swaggerBundle = ["swaggerCore", "swaggerAnnotations", "swaggerModels", "swaggerJaxrs2"]

testcontainersBundle = ["testcontainersPostgres", "testcontainersCore", "testcontainersJunit"]
testingBundle = ["junitJupiter", "junitPlatformLauncher", "mockk", "kotlinxCoroutinesTest"]
